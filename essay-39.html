<title>三法印人人會背，為什麼還是走不進涅槃？——王印要照順序蓋：拆膠卷、找導演、停放映</title>
<meta content="「諸行無常、諸法無我、涅槃寂靜」人人會背,但為什麼是這個順序?《大智度論》卷二十二念法品給出答案:三法印不是三句格言,而是一條不能倒著走的思維路線圖。第一步觀無常:像逐格暫停電影,把「連續」拆成「剎那」——相似相續故,人以為一;第二步推無我:五層推論鏈直落(念念生滅→屬因緣→不自在→無主→無我),每一格膠卷裡都找不到導演;第三步歸寂滅:不是得到什麼,而是三毒之火因抽掉戲論之柴而自熄。並解開精微一問:無常為何只蓋有為法,無我卻通查一切法(破外道「神常遍知」)。三印即一印:觀無常即觀空,觀無我即觀無自性,不著二者即歸寂滅。跳過無常直接背「無我」是背誦不是觀行;跳過前二直接求「寂靜」是壓抑不是涅槃。從等待救贖到構建因緣:莫向外求時節,當向內具足條件。" name="description"/>
