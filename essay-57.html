<title>如來在哪裡？——觀如來品：五求皆空，但以假名說</title>
<meta content="《中論》觀如來品第二十二：「非陰不離陰，此彼不相在；如來不有陰，何處有如來？」如果佛是實體，佛在哪裡？龍樹沿著五陰一路追問：即陰、離陰、相在、相有，五種找法全部落空；「因緣和合而有」也過不了自性與先後的檢驗。如來不可得，不是沒有佛——是佛不在概念裡。連「空」也不可執，但以假名說；離斷常兩種邪見，安住寂滅：如來性即世間性。" name="description"/>
