<title>「一切凡夫皆是禪定」？——普華六問「智慧第一」舍利弗：把可得、可住、可躲拆光，修行反而純了</title>
<meta content="《大智度論》卷二十八第三品《明網經》六輪法性之辯導讀:普華菩薩六問「智慧第一」舍利弗,所破的是三樣東西——把智慧當「可得」的資產(依境界證量而說)、把禪定當「可住」的避難所(躲入滅盡定)、把聖位當「可躲」的高地(凡聖兩橛);所立的是不壞法性——法性非得相、無有法非定相(一切凡夫皆是禪定,以不壞法性三昧故)、聖無滅法凡無生法皆不出法性等相,終至一切法皆如、大火聚無物不燒(連對潔淨的執著也燒盡)。本文附六輪對話總表與生活坐禪檢核表:不站在證量上說話、不追境界不貪座上寂靜、念頭常滅不補一刀、不慢不卑,並以二諦說明「無所得」不是躺平——堵住炫耀、逃避、比較三漏,修行反而純了。" name="description"/>
