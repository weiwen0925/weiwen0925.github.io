<title>為什麼這一品是《大智度論》的「防線柱」？——「一切皆空」，邪見與大乘同聲卻是兩個世界</title>
<meta content="《大智度論》卷十八第七品「摩訶衍空門」,是龍樹在百卷大廈裡立的一根「防線柱」:它設在大乘性空義與外道斷滅見之間最危險的一線之隔,確保後續所有關於「空」的教學,都不至於被誤讀為虛無主義。全品七章層層辨析——脈絡、原典、時間因果、體相、心法戲論、七重辨證,最終結穴於三門統攝。掌握本品的判準,才讀得出「一切皆空」在邪見與大乘口中雖然同聲、卻是兩個世界:一條墮向斷滅撥無因果,一條入真空而起妙用。" name="description"/>
