<title>厭離，為什麼還不是終點？——同一具不淨之身，聲聞看見「該逃的髒」，中觀看見「無主的空」</title>
<meta content="《大智度論》卷十九身念處的收官「兩重見地」:聲聞觀身不淨而生厭離,中觀由因緣直入空性——為什麼後者更高?關鍵在中間那一步「因緣」。厭離只是評價的反轉(淨→髒),地基「身是實有」原封未動;嫌惡與貪愛其實共用同一個實有見,執「不淨」為絕對真實,還可能墮入厭世毀身的另一極端。「因緣」換掉的不是答案而是問題:不問身體髒不髒,問身體怎麼存在——四大和合、無主人、如水沫聚,「因緣所生法,我說即是空」。罪福無主:連「不淨」也只是對治貪欲的工具,用完即放。厭離的出口是逃離,逃離恰恰承認了監獄的真實;空性的出口是借假修真——知身不淨而不毀身,知身如幻而善用之,這才是菩薩能留在世間的地基。" name="description"/>
<meta content="Chengweiwen" name="author"/>
