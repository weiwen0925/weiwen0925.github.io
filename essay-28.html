<title>拔草，還是看穿草？——四正勤與精進波羅蜜，同一句「斷惡修善」的兩個宇宙</title>
<meta content="早期佛教的「四正勤」與大乘的「精進波羅蜜」,字面幾乎是同一張處方箋:已生惡令斷、未生惡令不生、未生善令生、已生善令增長。差在哪?差在你相信「惡」是什麼。四正勤站在法體實有的本體論上:惡是實物,斷惡如拔草,是一項實質工程;精進波羅蜜與般若相應:蓋即是空,對治是照見,如幻藥治幻病——勤而無「勤者」,斷而無「所斷」。內證就在《大智度論》卷十九:龍樹明確給出聲聞三十七品與菩薩三十七品「以不可得故」的雙讀。更深一層:菩薩道必須站在無自性上——若惡實有,無量眾生之惡即無量,盡未來際的大願早該絕望;唯其如幻,大願才撐得起。拔草的手不停,執草的心先放。" name="description"/>
<meta content="Chengweiwen" name="author"/>
