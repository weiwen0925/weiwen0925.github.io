<title>「十一種智慧」記不完，阿毘達磨到底要幹嘛？——把「規格表」讀成「地圖」，讓分析在見道那一念裡自己融化</title>
<meta content="讀《大智度論》卷二十三「釋十一智論」，很多人會被阿毘達磨勸退:法智、比智、他心智、世智、苦集滅道四智、盡智、無生智、如實智——十一個名字還沒記熟,後面又是所緣、相攝、根相應、三三昧、十六行相、見道十六心……表格一張接一張,像在背產品規格書。本文用兩個角度解圍:一,阿毘達磨不是「故事」而是「規格表」,別逐格硬背,抓三條主線(依界的法智比智、依諦的苦集滅道、依位的見道十六心)就抓住骨架;二,見道十六心其實是一念之間智慧增長的實修現場,不是抽象數字;而全品的結論更關鍵——十智入如實智、失本名字、唯一實智,如百川歸海。分析是渡河的筏、是鷹架:用它磨利觀照,再讓它化進「滅諸觀法」的如實直觀。世智但知假名(如只認得「屋」卻不知棟梁椽壁),修行就是把生活裡的每個「名」拆回緣起。附十一智規格總表與見道十六心圖。" name="description"/>
