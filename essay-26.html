<title>破完之後，世界為什麼還在？——二諦門：「若不依俗諦，不得第一義」，中觀「破而不壞」的祕密</title>
<meta content="《大智度論》卷十八四門映射的收官之門「二諦門」。前三門把自身(有無)、關係(一異)、來歷(本際)全部問倒,讀者最自然的疑問是:一切都破完了,明天早上水還燒得開嗎?第四門的回答:「地堅水濕,火熱風動」——世俗語言照用不誤;「若不依俗諦,不得第一義」——不但照用,勝義還必須借道世俗才能被指認。二諦不是兩個世界,是同一緣起世界的兩層說法;前三門破的是「自性」這個錯誤的形上學附加物,從來不破緣起的作用與假名的溝通。破的是自性,不是世界——世界宛然如初,只是再也困不住你。這正是中觀「破而不壞」的祕密,也是四門作為完整論證「三破一收」的收刀式。" name="description"/>
<meta content="Chengweiwen" name="author"/>
