<title>又叫你「勿起想」，又叫你「立一念」</title>
<meta content="般舟三昧經第一品的心法只有八個字：絕待一念，唯心如幻。可是讀者一定會卡住——上一句才「勿念惡，勿念善；勿念空，勿念實；勿起想，有與無」把想全關掉，下一句又要「立一念，斷諸想」；再往下「心作佛，心自見」看起來還立了能所。而中論講的是空亦復空、無可斷無可生。本篇指出鑰匙就在經文自己身上：念與想是兩個字，而「心起想則癡，無心是涅槃」這一句反過來證明了那一念不是想。附相待、三時、自Ｘ不成三把中觀的尺，以及「無能所而見佛宛然」的收束。" name="description"/>
<meta content="Chengweiwen" name="author"/>
