<title>十六觀行記不住？別背——把它收成三個問題：三解脫門，一把隨身的「破執羅盤」</title>
<meta content="《大智度論》卷二十把「從凡夫到涅槃」看成一趟旅程,用三個問題定位它:是誰在走?如何走?走到哪?——空、無作、無相三解脫門恰好對應。空三昧(空・無我)是主體門,破「能走之人」的我執;無作三昧(無常苦集因緣生道正跡到,十行相)是過程門,破「走的過程」的造作意圖;無相三昧(盡・滅・妙・出)是目標門,破「有一個實有涅槃可取」的取相。十六觀行之所以記不住,是因為你在背清單、而不是用羅盤:十六=2+10+4,只是三門的細部展開,實修時你握的是三門、不是十六項。用法:先安住,執一生起就問「這是我、勤、相哪一維的執?」,隨當下卡點抽出對應那一門,鬆開再回到安住。欲界初學者的最小方案:先熟「有沒有一個我?」(空門)與「我是不是在硬求結果?」(無作門)兩問。到達涅槃不是走到某處——無相門正是破這個:所到之處無相可取,三種執(我/造作/取相)一齊放下,當下即是。" name="description"/>
<meta content="Chengweiwen" name="author"/>
