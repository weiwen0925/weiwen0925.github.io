<title>「本無所有，故無所失」是心靈雞湯嗎？——雙重視角沒說完的心法：會逃的我執、不能「換」的視角，與瓶破之後的體溫</title>
<meta content="《大智度論》卷十九內外身觀(品12)收在一格對照卡上:凡夫視角「尋找失敗」故生失望,般若視角「本無所有」故得解脫——就這麼簡單嗎?是,但那是果地的簡單,不是因地的容易。本文補上被壓縮掉的四層心法:①卡片之前是一場沒有捷徑的搜索——內觀、外觀、總觀三步順序不可換,因為我執會逃(內堵逃外、外堵縮內、最後躲進「內外之間」),跳過搜索直接背誦「本無所有」是知解不是解脫;②般若視角嚴格說不是「視角」——凡夫的兩種視角都站在瓶內,般若是瓶壁(身見)破掉,沒有站的位置,所以它不能被「採用」,只能等搜索做完後自己現前;③「無所失」之後還有「無所得」——所觀已竟不是找到答案,是再無盲點,若把解脫抓成新的所得,只是換了更精緻的瓶子;④瓶破之後,他人之苦不再是「外」——一際無異開出同體之悲。下次焦慮升起,先別急著換視角:問自己搜索做了沒。做了,視角不用換,它自己塌。" name="description"/>
