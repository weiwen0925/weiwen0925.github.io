<title>「什麼都沒了」也是一種執著——斷滅的「無」，偷偷替「無」立了一個定性；空不是把世界歸零</title>
<meta content="《中論》觀有無品「定有則著常，定無則著斷」「若法有定性，非無則是常，先有而今無，是則為斷滅」常讓人卡住：「無」明明像在否定自性，為什麼中論說它也是自性見？空會不會就是斷滅、就是把世界歸零？本文用兩把鑰匙解開：一是這一品的「有／無」都是「定性的有／定性的無」；二是斷滅其實替「無」再立了一個定性、還預設了先前的「定有」。常見與斷見是同一枚自性硬幣的兩面。最要緊的分辨是「斷滅無 vs 空無」：斷滅切斷相續、撥無因果，空則鬆開兩邊、成就因果（以有空義故，一切法得成）。附硬幣兩面圖、斷滅／空對照圖與整理總表。" name="description"/>
