<title>別問「緣到哪算完」——大空義、海潮魚，與一息的返潮</title>
<meta content="修慈心觀往外推，推到「這樣算緣完了嗎」那一刻，暖意忽然沒了——《大智度論》卷三十一講「大空」時停下來處理這個現場：答「盡了」墮邊見，答「還沒盡」墮無邊見，二見生則即失慈心。論主給的喻是海潮魚：水至常限自己旋還，魚不還就漂在露地。本篇讀完這一段，與《中論》〈觀本際品〉「本際不可得」對讀——同一把尺，一從空間、一從時間；並辨明三個常見誤讀（「還」不是回歸本源、「常限」不是外加的規矩、魚不還不是游太遠），以及兩部論拆完尺後各留下什麼（戲論息與不失慈心）。末三節搬上呼吸：出息、盡處、入息就是一次完整的潮，附返潮四步與「尺的辨識表」。接在第 58 篇之後，同屬呼吸觀線。" name="description"/>
<meta content="Chengweiwen" name="author"/>
