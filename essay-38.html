<title>還沒入初禪，這張圖與我何干？——對攝圖的三個台階：地圖不是門檻、本卷自帶欲界入口、次第的心現在就能練</title>
<meta content="《大智度論》卷二十一的對攝圖一攤開:八背捨、八勝處、十一切處、九次第定,全都標著「初禪以上」。還在欲界、連初禪都沒入的我們,是不是只能望圖興嘆?本文給三個台階:①先把圖讀對——它是地圖不是門檻,登山口看等高線圖的人不需要出示登頂證明,知道三禪無攝、滅受想是終點,反而防止把輕安當證量、把頑空當滅盡;②本卷自帶「欲界入口」——品四原典白紙黑字「九相,未離欲、散心人得,欲界繫」,九相如縛賊、十想如斬殺,九相正是為散心的欲界人設計的正課,八念則是塚間驚怖時的安全網,高階法門的因地版就擺在同一卷;③「次第」的心現在就能練——九次第定的定義是「心心相次,不令異念得入」,判準是心柔軟、善斷法愛,這個「不夾雜」的品質,一炷香、一卷經、一件事裡今天就能練。中觀收束:氣餒來自把階位讀成自性的高牆,初禪不是門禁而是坡道;以不可得故行禪,得之不高、未得不卑。圖上畫的是果地的樓層,你腳下的九相與八念,就是它的樓梯。" name="description"/>
