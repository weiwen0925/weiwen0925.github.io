<meta content="《大智度論》卷十九第七品「神我辯」:行者在禪觀中發現心像僕役,於是追問「是心屬誰?誰使是心?」——這個問題本身就偷渡了「必有使者」的主宰語法。外道端出國王(神我)—將軍(心)—士兵(身)的直覺控制模型,加上目的論與私密論兩條援軍;龍樹以三把辯證利刃拆解:無窮倒退(使我者誰?是則無窮)、功能二難(盲眼國王或多餘將軍)、無相故無(屬性審計全數劃掉);再以火喻完成範式轉移——火性自能燒,不假於人,畢竟無作者。哲學收在十六字口訣:將軍即幻化,國王本無生。實修落成四步觀照演算法:念起→追問誰使→唯見因緣→放下神我,循環不息;強烈情緒另配野火觀想——情緒如天氣,無受害者,亦無控制者。觀諸法和合因緣生,無有實法有我,是名法念處。" name="description"/>
<meta content="Chengweiwen" name="author"/>
