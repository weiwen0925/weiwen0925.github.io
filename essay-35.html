<meta content="《大智度論》卷二十用兩個古怪的詞「有分」(整體)與「身分」(部分)逼問:那個統合零件的「整體」,到底真有一個東西,還是只是一個名字?龍樹的夾殺很簡單——「整體」與零件的關係只有兩種:相同(不異)或不同(異)。若相同:一個零件就是整台車→一台變幾十台,或「整體」消失只剩散件。若不同:把零件全拆光,你還指得出那個「車」嗎?兩條路都走不通,所以「整體」不是零件之外另有的實體,只是零件湊在一起時我們貼上的一張名字標籤(假名)。回到身體:手腳頭軀是零件,「身體」是整體,同樣兩難——拆光零件沒有一個「身體」跑掉。破身則破男女相:不是說沒有男女現象,而是沒有一個實有固定的男女身。這正是四念處「觀身」的中觀版,鬆開「我這具身體鐵板一塊」的實執。" name="description"/>
