<title>帶業修行的數學模型——菩薩如何「與闇共住」而仍能照見</title>
<meta content="《大智度論》卷十八「闇室燃燈喻」:破闇不需全明。前燈(菩薩)雖與闇共住,在燈光的絕對範圍內依然能皆悉分了(照見實相);後燈(佛)盡諸煩惱,倍復明了。關鍵通則是——見性是「局部功能成立」,不是「全域開關」:只要光區非空,照見就在該範圍內真實有效,不因外圍無明而被剝奪。這正是「帶業修行」「煩惱即菩提」可以成立的動態機制與數學模型:域Ω上的照見函數 φ 在光區 L 上恆真,成立條件是 L 非空(而非 L=全域);修行是光區逐步擴大、趨近全域(佛)的單調過程。" name="description"/>
