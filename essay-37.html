<title>「隨心行」「受相應」到底在說什麼？——用一杯甜茶，讀懂四禪最硬核的阿毘達摩（附全景總表）</title>
<meta content="《大智度論》卷二十把四禪像機器一樣拆開:淨禪與無漏禪、色與非色、五眾與無表色、相應與隨行、隨心行與受相應的四句分別、覺觀的隱退、次第緣與增上緣……滿頁阿毘達摩術語勸退。本篇用一杯甜茶把它講透:受(vedanā)不是「接受」而是「感受」的苦樂捨三種調子;相應像雙齒輪嚙合(心數法與心同步),隨行像車廂隨車頭(身口業依附卻不相應);再以「是否隨心行×是否受相應」兩軸交叉出四象限——心是受相應非隨心行(它是被伴隨的核心),受與身口業是隨心行非受相應(受不能與自己相應),想與行則兩者皆是。並附一張把節四到節七整段分析收攏的四禪全景總表。" name="description"/>
