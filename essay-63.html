<title>它說的每一句都是佛法——只有一個字不是</title>
<meta content="〈觀業品〉最難讀的地方，是反方沒有一句話可以直接說「錯」。他引的是佛說的經（一切眾生皆隨業而生）、用的是佛親口的二業（思與從思生）、舉的是十白業道，連「不失法」都抬出「諸佛辟支佛賢聖所稱歎」。真正被偷換的只有兩個字——「決定」。本篇把反方四次包裝與龍樹四次回刀並排：無作（存檔）→ 住則常滅則無；相續（借無常的語言）→ 類比失效‧轉化死結‧一穀生一切世間穀；不失法如券（跳出線外另立載體）→ 是義俱不離斷常過‧無窮倒退‧受報已而應更復受‧不作亦名業。附完整對照總表、龍樹正解（雖空亦不斷，雖有亦不常）與五句日常自檢：你發過幾張券。" name="description"/>

function render(){

    Object.keys(vols).forEach(function(k){

    });

function fabPlace(){ /* 避讓左側固定導覽欄(sb-nav 等):排到欄右側 12px */
