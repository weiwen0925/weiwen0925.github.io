<title>閉上眼睛見道，還是睜著眼睛見道？——觸目菩提：大乘與小乘看「究竟實相」的分水嶺</title>
<meta content="《大智度論》卷十八「究竟心法」章的核心一句:「但觀外緣中實相,非淨、非不淨,非常、非非常,非樂、非苦,非空、非實,非我、非無我。」聲聞常以入滅盡定、斷絕外緣為究竟——先把現象界關機,才敢說見到實相;菩薩卻敢在色受想行識、眼耳鼻舌身意的一切外緣中,直接照見實相——觸目菩提。分水嶺不在定力深淺,而在見地:若實相必須靠「關掉現象」才能顯現,它就成了現象之外的另一個東西,又被實體化;實相是諸法的實相,不是諸法之外的實相。承認現象而不被現象黏住,在名言的表面即見其無自性——這是大小乘看「究竟」的兩種眼神,也是般若波羅蜜真正的下手處。" name="description"/>
