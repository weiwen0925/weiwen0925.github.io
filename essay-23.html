<title>「牛中無羊相」在說什麼？——龍樹對萬法只問四個問題：自身、關係、來歷、說法</title>
<meta content="《大智度論》卷十八的四組辯證,與《中論》四個專品一一對應,構成一張映射矩陣——但四門並列常讓人迷路,其中「一異門」的「牛中無羊相」尤其難解。本文給出一把統整鑰匙:四門,就是對任何一法能問的四類基本問題——它自己存在嗎(有無)?它跟別的東西同還是異(一異)?它從哪裡來(本際)?破完之後我們還能怎麼說話(二諦)?前三門層層破自性,第四門把緣起世界還給你。再細拆最難的一異門:牛之所以是牛,靠的是「牛中無羊相」——身份由排除他者襯出,是差異網絡中的位置,不是內在本質;定一則不應變異,定異則彼此斷裂,一異俱不成,故自性不可得。" name="description"/>
