<title>「為什麼」問到底，會發生什麼事？——本際門：第一因、無窮、無因的三岔口</title>
<meta content="《大智度論》卷十八四門映射的第三門「本際門」,起手式:「因復有因,如是則無窮……」——三歲小孩連環問「為什麼」的那條路,哲學家也擋不住。往上追因,只有三個出口:立一個第一因(它自己從哪來?)、承認無窮後退(永遠到不了地面)、或乾脆說無因(撥無因果)——三條都是死路。龍樹的判定:三岔口之所以無解,是因為把因果鏈當成了實體的鐵鍊。「無窮則空」——找不到自性的起點,不是因果失敗,恰是因果無自性、緣起如幻的證明。實踐上,這一門讓人不墮宿命論(第一因把我定死)也不墮無因論(反正隨機就擺爛):鏈條如幻,當下之因即可轉。" name="description"/>
<meta content="Chengweiwen" name="author"/>
