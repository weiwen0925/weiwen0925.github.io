<title>一根手指，破了兩品——《中論》換招換不停，其實只有一套工具</title>
<meta content="《中論》二十七品讀起來像二十七套武功，其實龍樹只有一個問題：拿掉別的，它還在嗎？本篇從一個怪事進場——同一根手指在〈觀染染者品〉與〈觀合品〉各出現一次，破的卻是兩件不同的事。順著這條線排開，生、住、滅、見、合、作六個動作全在同一個地方失效：自X 要求同一個東西同時當能與所。文中另分辨兩種常被混為一談的論證（伸手就知道的，與推出來的），還原對手兩條方向相反的救援路線，並補上一手極少被講的破法——把燈換成闇的對稱歸謬。附全論自X 族譜表。" name="description"/>
