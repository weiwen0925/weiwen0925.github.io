<title>想「得到」涅槃的那個念頭，本身就是綁住你的繩——「生死即涅槃」是什麼意思</title>
<meta content="《中論》觀縛解品「若不受諸法，我當得涅槃；若人如是者，還為受所縛」「不離於生死，而別有涅槃，實相義如是，云何有分別」——修行者最容易落入的陷阱：想「得到」涅槃的念頭本身就是一種取著（受），用「取」去求「無取」，還是縛。而涅槃不在生死之外的另一個地方，它就是同一個緣起實相，在取著止息、如實而見時的樣子：生死即涅槃。本文拆兩偈的一負一正，附「三根抓取的釘」圖、「同一實相的取／不取」圖與整理總表。實修落點：解脫不是搬家，是把「想逃、想得」的那隻手鬆開。" name="description"/>
