<title>知道「一切皆空」之後，為什麼還要拼命斷惡修善？——聲聞與般若，修行的兩隻翅膀</title>
<meta content="《大智度論》卷十九用「無處所」的空性,把四正勤與四如意足整組重寫:不是叫你停手,而是換一雙眼睛做同一件事。第一次重寫——四正勤的「勤」成了「無作之勤」:精進在進行,卻找不到一個精進者(無作者 No Agent),也不住任何處所(無依止 No Basis);所斷之惡當成真有實體只是聲聞的對治方便,非般若究竟。第二次重寫——四如意足不是逃到一個叫「空」的地方安住,觀空是見地不是去處:斷惡如夢中滅火(全力救火而明知火不真)、煩惱如可穿透之牆(看穿無自性而過,非硬撞)。動(斷惡修善)靜(照見無自性)互攝,是修行的兩隻翅膀,缺一不能飛。結穴於菩薩道:終日度生,終日無度。" name="description"/>
