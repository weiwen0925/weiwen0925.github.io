<title>「是他害我的」，講到最後只剩一條死路——觀苦品的「他作」坍縮鏈：把那個「他」拆開，只是另一串五陰之苦</title>
<meta content="《中論》觀苦品第八偈青目釋只有三十餘字，卻常讓人卡住：「離苦無彼自性。若離苦有彼自性者，應言彼作苦，彼亦即是苦，云何苦自作苦？」本文回答三個疑問：這句是不是前後矛盾？「他本身也不過是苦」是什麼意思？結論怎麼會繞回「苦自作苦」？鑰匙有二：這一品的「苦」是五陰的技術定義，以及青目「退一步的歸謬」語氣。他作苦→彼亦即是苦→苦作苦→自作→刀不自割，一條坍縮鏈走到底。附流程圖、自他判定圖與三問三答總表。" name="description"/>

      var zh=[],zord=Object.keys(zperk),zrd=0,zadd=true,DZ=EXP.z?XCAP:80;
      zord.sort(function(a,b){var na=/^\d+$/.test(a)?parseInt(a,10):-1,nb=/^\d+$/.test(b)?parseInt(b,10):-1;return na-nb;});
      while(zh.length<DZ&&zadd){zadd=false;
        for(var zo=0;zo<zord.length;zo++){var zpa=zperk[zord[zo]];
          if(zpa.length>zrd&&zh.length<DZ){zh.push(zpa[zrd]);zadd=true;}}
        zrd++;}
      if(zh.length){
        var M3=EXP.z?XCAP:12,S3=Math.min(zh.length,M3);
        h+='<div class="wys-head">總表內容 · '+ztot+' 筆 <span class="wys-hint">達該品(右下有總表鈕)</span></div>';
        for(var r3=0;r3<S3;r3++){var it2=zh[r3];
          var vk=vols[it2.k];
          h+=row('wys-tag2',esc(label(it2.k))+'・品'+it2.p,baseOf(it2.k)+'#'+((vk&&vk.a)||'chapter')+'-'+it2.p,
            '<span class="wys-tt">'+esc(it2.title.slice(0,26))+'</span><br>'+hlAll(snippet(it2.txt,ts),ts));}
        h+=EXP.z?xnote(ztot,S3):xmore('z',ztot,S3);
      }
    }
    /* ⑤ 白話翻譯（各卷「譯」浮動鈕的 原文↔白話↔中觀概念 對照表；search-index.json 鍵 bhv，
         陸續上傳的品重跑部署腳本即自動入索引）——全量收集算真實總數、round-robin 分卷公平 */
    var bhv=IDX.bhv||[];
    if(bhv.length){
      var bperk={},btot=0;
      for(var w=0;w<bhv.length;w++){var bit=bhv[w];
        if(matchAll(bit.t+' '+bit.x,ts)){
          var bk=String(bit.k);
          (bperk[bk]=bperk[bk]||[]).push(bit);btot++;}}
      var bh=[],bord=Object.keys(bperk),brd=0,badd=true,DB=EXP.b?XCAP:80;
      bord.sort(function(a,b){var na=/^\d+$/.test(a)?parseInt(a,10):-1,nb=/^\d+$/.test(b)?parseInt(b,10):-1;return na-nb;});
      while(bh.length<DB&&badd){badd=false;
        for(var bo=0;bo<bord.length;bo++){var bpa=bperk[bord[bo]];
          if(bpa.length>brd&&bh.length<DB){bh.push(bpa[brd]);badd=true;}}
        brd++;}
      if(bh.length){
        var M5=EXP.b?XCAP:8,S5=Math.min(bh.length,M5);
        h+='<div class="wys-head">白話翻譯 · '+btot+' 筆 <span class="wys-hint">開啟白話翻譯表</span></div>';
        for(var r5=0;r5<S5;r5++){var bt2=bh[r5];
          h+=row('wys-tag5',esc(label(String(bt2.k)))+'・品'+bt2.p,baseOf(String(bt2.k))+'#bh-'+bt2.p,
            '<span class="wys-tt">'+esc(bt2.t.slice(0,26))+'</span><br>'+hlAll(snippet(bt2.x,ts),ts));}
        h+=EXP.b?xnote(btot,S5):xmore('b',btot,S5);
      }
    }
    /* ⑥ 疑難注腳（注腳設定單一真源 → search-fn 分片；連結直達該節摺卡） */
    var fnv=IDX.fnv||[];
    if(fnv.length){
      var fhits=[];
      for(var f1=0;f1<fnv.length;f1++){var ft=fnv[f1];
        if(matchAll(ft.t+' '+ft.x,ts))fhits.push(ft);}
      if(fhits.length){
        var MF6=EXP.f?XCAP:6,SF6=Math.min(fhits.length,MF6);
        h+='<div class="wys-head">疑難注腳 · '+fhits.length+' 筆 <span class="wys-hint">跳至該節展開摺卡</span></div>';
        for(var f2=0;f2<SF6;f2++){var fe=fhits[f2];
          h+=row('wys-tag6',esc(label(String(fe.k)))+'・注腳',baseOf(String(fe.k))+'#'+fe.a,
            '<span class="wys-tt">'+esc(fe.t.slice(0,30))+'</span><br>'+hlAll(snippet(fe.x,ts),ts));}
        h+=EXP.f?xnote(fhits.length,SF6):xmore('f',fhits.length,SF6);
      }
    }
  }
  if(!h){
    if(!IDX.vols)h='<div class="wys-head">索引載入失敗 · 請檢查網路後重新整理頁面</div>';
    else h='<div class="wys-head">查無結果 · 換個關鍵詞試試</div>'
         +'<div class="wys-more">多詞以空格分隔時，須「同一品／同一項」同時含有全部詞；可改試單詞或同義詞</div>';
  }
  sres.innerHTML=h;
}
var timer=null;
sin.addEventListener('input',function(){clearTimeout(timer);timer=setTimeout(render,220);});
sin.addEventListener('search',render);
sres.addEventListener('click',function(e){
  var sc=e.target.closest&&e.target.closest('[data-wq]');
  if(sc){sin.value=sc.getAttribute('data-wq');try{sin.focus();}catch(x){}render();return;}
  var la=e.target.closest&&e.target.closest('a[href]');
  if(la){try{var rq=(sin.value||'').trim();if(rq&&rq.length>=2){
    var r=JSON.parse(localStorage.getItem('wysRecent')||'[]');
    r=[rq].concat(r.filter(function(x){return x!==rq;})).slice(0,8);
    localStorage.setItem('wysRecent',JSON.stringify(r));}}catch(x){}}
  var xm=e.target.closest&&e.target.closest('[data-xmore]');
  if(xm){EXP[xm.getAttribute('data-xmore')]=1;render();}
});
function smClose(){sm.classList.remove('show');document.documentElement.style.overflow='';}
idoc.addEventListener('keydown',function(e){if(e.key==='Escape')smClose();});
fab.addEventListener('click',function(){sm.classList.add('show');document.documentElement.style.overflow='hidden';
  loadIdx();try{if(!(sin.value||'').trim())renderStarter();}catch(e){}setTimeout(function(){try{sin.focus();}catch(e){}},60);});
sm.addEventListener('click',function(e){if(e.target===sm)smClose();});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sm.classList.contains('show'))smClose();});
function fabPlace(){ /* 避讓左側固定導覽欄(sb-nav 等):排到欄右側 12px */
  var right=0,cands=document.querySelectorAll('[class*="sb"],[class*="side"],[class*="rail"],nav,aside');
  for(var i=0;i<cands.length;i++){var el=cands[i];
    if(el===fab||sm.contains(el))continue;
    var st;try{st=getComputedStyle(el);}catch(_){continue;}
    if(st.position!=='fixed'&&st.position!=='sticky')continue;
    var r=el.getBoundingClientRect();
    if(r.left<48&&r.width>0&&r.width<150&&r.height>200&&r.right>right)right=r.right;
  }
  fab.style.left=(right>0?Math.round(right)+12:24)+'px';
}
function fabShow(){fab.classList.toggle('show',window.scrollY>250);fabPlace();}
setInterval(fabPlace,1500);
window.addEventListener('scroll',fabShow,{passive:true});
setTimeout(fabShow,600);setTimeout(fabShow,2000);
sres.addEventListener('click',function(ev){var c=ev.target&&ev.target.closest?ev.target.closest('.wys-chip'):null;if(!c)return;var w=c.getAttribute('data-w');if(!w)return;/*WY-CHIPW*/ev.preventDefault();ev.stopPropagation();try{sin.value=w;render();sin.focus();}catch(e2){}});
})();
</script></body>
